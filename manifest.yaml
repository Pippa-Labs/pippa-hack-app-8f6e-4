# ─────────────────────────────────────────────────────────────────────────────
# Who Lived Here — the app's manifest. This file IS the app's contract.
#
# Everything Pippa shows a user about the app is generated from this file, and
# the runtime refuses anything not declared here: `outcomes` is the only thing
# the app can be asked to do, and `output` names every field it may return.
# Structure and comments follow Pippa-Labs/pippa-hack-space-photo.
# ─────────────────────────────────────────────────────────────────────────────

manifest_version: 1

# Every hackathon app keeps nothing between calls. Do not change this.
persistence: none

# Public author name: a pseudonym, shown as "by <name>" on the install screen,
# in the list of apps and on every answer. 3 to 30 characters; letters,
# numbers, spaces, dots, hyphens, underscores; never an email or web address;
# never "pippa", "official" or "verified". Change it to your own pseudonym
# before the first push if you like.
app_author_name: "Plaque Hunter"

app:
  # `hack.` + the repository name with `pippa-hack-` removed, hyphens turned
  # into underscores:  Pippa-Labs/pippa-hack-app-8f6e-4 -> hack.app_8f6e_4
  # (setup.yml rewrites this from the real repository name if it differs).
  id: hack.app_8f6e_4
  name: Who Lived Here
  # Three numbers. Bump it after pressing "Submit for review" (0.1.0 -> 0.1.1).
  version: 0.1.0
  # Written for someone deciding whether to install it. What it does and what
  # it sends anywhere. Never the word "b-y" (the badge splits on it).
  summary: >-
    Who lived near a London street, station, landmark or postcode: names the
    three nearest blue plaques, one line on who each person was, the plaque's
    address and the distance in metres. Places come from a built-in list; only
    a full postcode is sent to postcodes.io.
agent_types:
  - personal

# ── Outcomes ─────────────────────────────────────────────────────────────────
#
# One job. Pippa picks this app by comparing the user's message with `summary`
# and `example_phrases`, so these phrases are behaviour, not documentation:
# carrier words a person types, no single subject, no words other apps own.

outcomes:
  - id: plaques.nearest
    summary: Find the three London blue plaques nearest a place, and who lived there
    example_phrases:
      - who lived near
      - blue plaques near
      - which famous people lived around
      - nearest blue plaque to
      - who used to live on this street
      - famous former residents of
      - is there a blue plaque near
      - historic plaques close to
    inputs:
      - name: place
        type: string
        required: false
        description: >-
          The London place the person asked about, copied as they wrote it: a
          street address ("221B Baker Street"), a street ("Doughty Street"), a
          station ("South Kensington station"), a landmark ("the British
          Museum"), a neighbourhood ("Bloomsbury") or a postcode ("SW7" or
          "SW7 2DD"). Leave out words like "who lived near" and "blue plaques".
          If the message names no place, return an empty string rather than
          guessing; never use the person's own location.
    output:
      - name: place
        type: string
        description: The place the distances are measured from, as the app recognised it.
      - name: plaques
        type: array
        item_type: string
        description: >-
          The three nearest blue plaques, nearest first, each as
          "person — who they were — plaque address — distance in metres".
      - name: distances_m
        type: array
        item_type: integer
        description: The distance to each plaque in metres, rounded to 10, in the same order.

# ── No API keys ──────────────────────────────────────────────────────────────
#
# The app needs none: the plaques and the places it knows ship beside app.py
# (plaques.json, places.json), and postcodes.io needs no key. So there is no
# `app_secrets:` block. `connectors:` and `secrets:` are not allowed in
# hackathon apps at all.
